services:
  backend:
    build: .
    container_name: assistant-backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./frontend:/app/frontend
      - ./nlu.py:/app/nlu.py
    restart: unless-stopped
