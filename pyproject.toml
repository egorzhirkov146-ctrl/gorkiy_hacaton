[project]
name = "gorkiy-voice-assistant"
version = "0.1.0"
description = "Voice Assistant for Personal Tasks, Meetings, and Reminders"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "SQLAlchemy>=2.0.35",
    "python-multipart>=0.0.9",
    "httpx>=0.27.2",
    "openai>=1.51.0",
    "dateparser>=1.2.0",
    "edge-tts>=7.3.1",
    "gTTS>=2.5.4",
]

[tool.vercel]
entrypoint = "backend.main:app"
